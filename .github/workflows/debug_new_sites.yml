name: Debug new real estate sites

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Debug bezrealitky.cz
        run: python scripts/debug_bezrealitky.py

      - name: Debug reality.idnes.cz
        run: python scripts/debug_idnes.py
        continue-on-error: true

      - name: Debug ulovdomov.cz
        run: python scripts/debug_ulovdomov.py
        continue-on-error: true
